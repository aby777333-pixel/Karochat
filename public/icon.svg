<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FB6FF"/>
      <stop offset="55%" stop-color="#3F7BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1F"/>
      <stop offset="100%" stop-color="#1A0E2A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#gBg)"/>
  <!-- Speech bubble with tail -->
  <path d="M256 64
           a192 192 0 1 1 -138 326
           c-18 -3 -30 7 -39 18
           c5 -18 7 -34 1 -43
           A192 192 0 0 1 256 64 Z"
        fill="none" stroke="url(#g)" stroke-width="34" stroke-linejoin="round"/>
  <!-- Eyes -->
  <circle cx="190" cy="220" r="26" fill="url(#g)"/>
  <circle cx="322" cy="220" r="26" fill="url(#g)"/>
  <circle cx="180" cy="208" r="8" fill="#ffffff" opacity="0.9"/>
  <circle cx="312" cy="208" r="8" fill="#ffffff" opacity="0.9"/>
  <!-- Smile + dimples -->
  <path d="M154 290 q102 110 204 0"
        fill="none" stroke="url(#g)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="154" cy="290" r="12" fill="url(#g)" opacity="0.85"/>
  <circle cx="358" cy="290" r="12" fill="url(#g)" opacity="0.85"/>
  <!-- Tail dot -->
  <circle cx="372" cy="408" r="20" fill="url(#g)"/>
</svg>
