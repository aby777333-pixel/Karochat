# Karochat — nginx same-origin Supabase proxy (HTTP + WebSocket).
#
# Production karochat.co is served from the self-hosted nginx droplet
# (168.144.152.135), NOT Netlify. This block makes /sb-proxy/* forward to the
# Supabase project directly in nginx — faster than the Next.js route handler and,
# critically, it proxies the Realtime WebSocket too (which a Next route can't).
#
# When this block is present, nginx handles /sb-proxy/* before it ever reaches
# Next.js, so the app/sb-proxy/[...path]/route.ts handler becomes a harmless
# fallback (used only if this block is removed or on the Netlify mirror).
#
# ── INSTALL ──────────────────────────────────────────────────────────────────
# 1) In the http { } context (e.g. /etc/nginx/nginx.conf), add the map ONCE
#    (skip if you already have a $connection_upgrade map for other sites):
#
#        map $http_upgrade $connection_upgrade {
#            default upgrade;
#            ''      close;
#        }
#
# 2) Paste the `location /sb-proxy/ { ... }` block below INSIDE the
#    `server { ... }` block for karochat.co (the one with server_name
#    karochat.co; that already proxy_passes to the Next.js app).
#
# 3) Test + reload:
#        sudo nginx -t && sudo systemctl reload nginx
#
# 4) Verify (should return Supabase JSON, not an HTML 404):
#        curl -i https://karochat.co/sb-proxy/auth/v1/health -H "apikey: <ANON>"
# ─────────────────────────────────────────────────────────────────────────────

location /sb-proxy/ {
    # Trailing slash on both location and proxy_pass strips the /sb-proxy/
    # prefix: /sb-proxy/rest/v1/x  ->  https://<ref>.supabase.co/rest/v1/x
    proxy_pass https://dxgduusbdvslusbushxi.supabase.co/;
    proxy_http_version 1.1;

    # WebSocket upgrade — this is what lets Realtime ride the proxy.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The upstream is multi-tenant behind Cloudflare: the Host header AND the
    # TLS SNI must name the Supabase host, or it 400s / serves the wrong cert.
    proxy_set_header Host dxgduusbdvslusbushxi.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name dxgduusbdvslusbushxi.supabase.co;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Don't buffer streaming responses (Realtime, storage downloads, SSE).
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
